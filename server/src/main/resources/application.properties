spring.application.name=facefit

# 서버는 평문 HTTP만 말한다 — 443 종단과 인증서는 Caddy 몫이다(설계 §3-6).
# 이 포트는 호스트에 노출되지 않고 도커 네트워크 안에서만 열린다(설계 §5 보안).
server.port=8080

# CORS 허용 오리진 — 미니앱이 실려 있는 곳이라 **서버 도메인이 바뀌어도 이 값은 안 바뀐다**(설계 §4-1).
# 개발용 localhost는 dev 프로파일에서만 더한다(application-dev.properties).
facefit.cors.origins=https://facefit.web.tossmini.com,https://facefit.private-web.tossmini.com

# 접속 정보는 전부 환경변수 주입 — 하드코딩하지 않는다.
# 호스트가 바뀌어도 이미지가 그대로여야 분리(설계 §3-6-1 ④)가 파일 복사로 끝난다.
spring.datasource.url=${FACEFIT_DB_URL}
spring.datasource.username=${FACEFIT_DB_USER}
spring.datasource.password=${FACEFIT_DB_PASSWORD}
# 커넥션 하나가 곧 MySQL 쪽 메모리다 — 기본 10에서 하향(설계 §3-6).
spring.datasource.hikari.maximum-pool-size=5
