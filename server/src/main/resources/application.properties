spring.application.name=facefit

# 서버는 평문 HTTP만 말한다 — 443 종단과 인증서는 Caddy 몫이다(설계 §3-6).
# 이 포트는 호스트에 노출되지 않고 도커 네트워크 안에서만 열린다(설계 §5 보안).
server.port=8080

# CORS 허용 오리진 **패턴** — 미니앱이 실려 있는 곳이라 서버 도메인이 바뀌어도 안 바뀐다.
#
# ⚠️ 정확한 이름을 맞히지 않는다. 설계 초안은 콘솔 QR 오리진을 `private-web`이라고 적었는데
# 실기기 실측은 `private-apps`였고, 그 한 글자로 모든 프리플라이트가 403이 됐다 —
# 그리고 앱은 무음 폴백이라 **아무 일도 안 일어난 것처럼 보였다**(T-009).
# 그래서 「우리 앱 이름으로 시작하는 tossmini.com 하위 도메인」으로 넓힌다. 토스가 환경
# 이름을 바꿔도 살아남고, 다른 미니앱 오리진(booktimer.*)은 여전히 막힌다.
# 개발용 localhost는 dev 프로파일에서만 더한다(application-dev.properties).
facefit.cors.origins=https://facefit.tossmini.com,https://facefit.*.tossmini.com

# DB 접속 정보는 **여기 안 적는다.** 운영에서는 환경변수
# `SPRING_DATASOURCE_URL` · `SPRING_DATASOURCE_USERNAME` · `SPRING_DATASOURCE_PASSWORD`가
# Spring의 relaxed binding으로 그대로 들어온다. 그 값은 SSM Parameter Store
# `/facefit/<같은 이름>`에서 배포 때마다 만들어진다(server/deploy/deploy-on-ec2.sh).
#
# 자리표시자(`${...}`)조차 두지 않는 이유: 이름이 SSM·환경변수·Spring 프로퍼티 세 곳에서
# **글자 그대로 같아야** 매핑 표가 필요 없어진다(BookTimer의 render-env.sh는 이름이 어긋난
# 것들 때문에 매핑 표를 유지하고 있고, 그 표가 유일 출처라 잃으면 복구가 어렵다).
# 하드코딩을 안 하는 것은 분리 준비이기도 하다 — 호스트가 바뀌어도 이미지가 그대로다(§3-6-1 ④).
# 테스트는 application-test.properties가 H2로 덮는다.
# 커넥션 하나가 곧 MySQL 쪽 메모리다 — 기본 10에서 하향(설계 §3-6).
spring.datasource.hikari.maximum-pool-size=5

# 레이트리밋(설계 §3-1). 서버가 열리면 누구나 부를 수 있는 무료 API가 되므로 이것과
# 「피해 상한」이 방어의 전부다 — 번들에 앱 토큰을 심는 것은 추출 가능한 장식이라 안 한다.
# 둘은 서로를 대신하지 않는다: 키당 상한만 있으면 가짜 키를 대량 생성해 우회할 수 있고,
# IP 상한만 있으면 한 사용자가 자기 몫을 다 태워 남을 막는다.
facefit.ratelimit.ip-per-minute=60
facefit.ratelimit.backup-put-per-key-per-minute=6
facefit.ratelimit.reminder-put-per-key-per-minute=6

# 기름종이 알림(설계 `docs/2026-09-03-oil-paper-reminder-design.md`).
#
# 「3시간」이라는 상수는 **여기 한 곳에만** 산다 — 클라는 본문 없이 PUT하고 dueAt을 받아
# 저장할 뿐이라(§3-2), 간격을 바꾸려면 이 값 하나면 된다(캘리브레이션 노브).
# ⚠️ 단 푸시 문구 A안이 「3시간」을 글자로 담고 있어, 이 값을 바꾸면 템플릿 재검수가 따라온다.
facefit.reminder.interval-minutes=${FACEFIT_REMINDER_INTERVAL_MINUTES:180}

# 아래 둘은 **비어 있는 것이 기본값**이다(다크런치). 콘솔 인증서·템플릿 승인이 아직인 동안
# 서버는 그대로 뜨고 알림만 쉰다 — 없으면 PUT은 503, 워커는 1회 경고 후 스킵한다.
# 값은 SSM `/facefit/<같은 이름>` → 환경변수로만 온다(레포에 비밀을 두지 않는다).
facefit.reminder.template-set-code=${FACEFIT_REMINDER_TEMPLATE_SET_CODE:}
facefit.reminder.kek=${FACEFIT_REMINDER_KEK:}

# 발송 API. mTLS 인증서는 프로퍼티가 아니라 **환경변수로만** 온다(BookTimer와 같은 방식) —
# `SPRING_SSL_BUNDLE_PEM_TOSS_KEYSTORE_CERTIFICATE` · `..._PRIVATE_KEY` 두 줄을 배포
# 스크립트가 .env에 쓰고, compose가 PEM 두 장을 /etc/facefit/toss로 읽기전용 마운트한다.
# 로컬·테스트에는 그 번들이 없다 → 메신저가 「미설정」이라 워커가 쉰다.
facefit.toss.api-base-url=${FACEFIT_TOSS_API_BASE_URL:https://apps-in-toss-api.toss.im}
facefit.toss.ssl-bundle=toss
