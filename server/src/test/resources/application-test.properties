# 테스트는 H2를 MySQL 모드로 쓴다(설계 §4-1).
# 운영 프로퍼티의 ${FACEFIT_DB_*} 자리를 프로파일 오버라이드로 덮는다 — 그래서 CORS 오리진 같은
# **진짜 운영값은 그대로 살아 있다**(테스트가 자기만의 값을 보면 무엇도 검증하지 못한다).
spring.datasource.url=jdbc:h2:mem:facefit;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# IP 상한을 사실상 끈다. 테스트는 전부 같은 가짜 IP에서 오기 때문에, 운영값(60)을 그대로 두면
# **테스트가 늘어날수록 무관한 테스트가 429로 깨진다** — 그것도 「마지막에 추가한 테스트」가
# 깨져서 원인이 엉뚱한 데로 간다. 상한 자체는 RateLimitTest가 자기 값으로 덮어써서 잰다.
facefit.ratelimit.ip-per-minute=1000000

# 기름종이 알림(설계 §3-4). 테스트는 고정 KEK로 봉인·개봉을 실제로 돈다 —
# 운영 KEK는 SSM -> 환경변수로만 오고, 없으면 알림만 조용히 쉰다(다크런치).
facefit.reminder.kek=ZmFjZWZpdC10ZXN0LWtlay0wMDAwMDAwMDAwMDAwMDA=
