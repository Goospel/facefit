// facefit API 서버 — 설계 `docs/2026-08-30-server-design.md` §4-1.
//
// ⚠️ 버전·의존성 이름은 **BookTimer와 맞춘다**(같은 호스트에 동거하고, 같은 사람이 운영한다).
//    설계 §4-1이 적은 `spring-boot-starter-web`·`flyway-core`는 Boot 3 이름이라 여기선 안 쓴다 —
//    Boot 4는 스타터가 쪼개지고 이름이 바뀌었다(`-webmvc`, `spring-boot-flyway`).

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.facefit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// ⚠️ Boot 4의 `-webmvc` 스타터는 Jackson을 **안 끌고 온다**(실측 — 컴파일 자체가 깨졌다).
	// 이 서버는 페이로드를 파싱해 검증하는 것이 일의 절반이라 JSON이 선택이 아니다.
	// ⚠️ 그리고 Boot 4가 딸려 오는 것은 **Jackson 3**다 — 패키지가 `com.fasterxml.jackson`이
	// 아니라 `tools.jackson`이고, `isTextual()`·`textValue()`가 `isString()`·`stringValue()`로
	// 바뀌었다. Jackson 2 예제를 그대로 붙이면 컴파일이 안 된다(실측 3.1.4).
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	// JdbcTemplate — 테이블 3개에 JPA는 과하다(설계 §4-1).
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// 스키마 버전 관리. `schema.sql`은 첫 ALTER에서 무너진다(설계 §4-1).
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// plain jar를 끈다 — 켜 두면 build/libs에 `*.jar`가 둘(부트/plain) 생겨,
// Dockerfile의 `COPY *.jar`가 어느 쪽을 집을지 모호해진다(BookTimer와 같은 이유).
tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}
