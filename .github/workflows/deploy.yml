name: Deploy server to EC2

# main에 push되면: 테스트 게이트 → ECR 이미지 push → EC2 배포(SSM) → 라이브 헬스체크.
# 배포 대상은 **서버뿐**이다. 미니앱은 앱인토스 콘솔로 따로 나간다(`npm run release`).
#
# ⚠️ 이 워크플로는 BookTimer의 deploy.yml을 본떴다 — 같은 인스턴스에 배포하니
#    운영자가 두 방식을 다 기억하지 않아도 되게. 다른 점은 blue/green이 없다는 것뿐이다
#    (이유는 server/deploy/deploy-on-ec2.sh 주석 — 메모리).
on:
  push:
    branches: [main]
    # 바뀐 파일이 **전부** 아래에 해당할 때만 건너뛴다 — 서버 코드가 하나라도 끼면 배포된다.
    paths-ignore:
      - '**.md'
      - 'claude-docs/**'
      - '.claude/**'
      - 'miniapp/**'     # 미니앱은 콘솔로 나가므로 서버를 다시 배포할 이유가 없다
  workflow_dispatch: {}

jobs:
  # 1) 테스트 게이트 — 통과해야 배포한다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run server tests
        working-directory: server
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  # 2) 빌드·푸시·배포
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC 토큰 발급(역할 assume)
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ⚠️ 빌드 컨텍스트가 레포 루트가 아니라 `server/`다(Dockerfile이 거기 있다).
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" server/
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "uri=$REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      # 배포 자산을 S3로. BookTimer의 ops 버킷을 **`deploy-facefit/` 접두어로** 나눠 쓴다 —
      # 버킷을 새로 만들지 않고, IAM 역할은 이 접두어에만 쓰기 권한이 있다.
      - name: Sync deploy assets to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws s3 sync server/deploy/ "s3://booktimer-ops-$ACCOUNT_ID/deploy-facefit/" --only-show-errors

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGION: ${{ secrets.AWS_REGION }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CMD="mkdir -p /opt/facefit && cd /opt/facefit && aws s3 sync s3://booktimer-ops-$ACCOUNT_ID/deploy-facefit/ . --only-show-errors && chmod +x *.sh && export AWS_REGION=$REGION FACEFIT_IMAGE=$IMAGE && ./deploy-on-ec2.sh"
          printf '{"commands":["%s"]}' "$CMD" > /tmp/ssm-params.json

          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "facefit deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "CommandId=$ID"

          # wait는 실패 상태에서도 논제로로 끝나므로 삼키고, 아래에서 상태를 명시 검증한다
          # (그래야 실패 원인 로그를 출력할 수 있다).
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "::error::EC2 배포 실패 (status=$STATUS)"
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text | tail -50
            exit 1
          fi

      # 배포가 "성공"인데 실제로는 안 도는 무성 실패를 막는 최종 게이트.
      # blue/green이 없으므로 **이 스텝이 유일한 실동작 검증**이다 — Caddy·DNS·인증서·컨테이너·DB를
      # 한 번에 통과해야만 200이 나온다.
      - name: Verify live health
        run: |
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://facefit-api.booktimer.app/health || true)
            if [ "$CODE" = "200" ]; then echo "live health OK"; exit 0; fi
            echo "attempt $i: http=$CODE"; sleep 5
          done
          echo "::error::배포 후 라이브 헬스체크 실패"
          exit 1
